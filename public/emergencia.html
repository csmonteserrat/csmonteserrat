<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
    background:#0B2136; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.5rem; user-select:none; padding:.5rem;
  }
  #botao{
    width:78%; aspect-ratio:1; border-radius:50%; cursor:pointer; font:inherit;
    font-size:2.4rem; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center;
    background:#16334D; color:#FF8A8D; border:3px solid #FF5A5F;
    transition:background .2s, color .2s, border-color .2s;
  }
  #botao:hover{background:#1D4265}
  #botao.armado{background:#E3A008; color:#231A02; border-color:#E3A008; font-size:.95rem}
  #botao.acionado{background:#D6383E; color:#fff; border-color:#D6383E; animation:pulso 1s ease-out 3}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(214,56,62,.7)} 100%{box-shadow:0 0 0 1.6rem rgba(214,56,62,0)}}
  #status{font-size:.62rem; font-weight:700; color:#7E94A8; text-align:center; min-height:.9rem}
  #status.erro{color:#FFB3B5}
</style>
</head>
<body>
  <button id="botao">⚠</button>
  <div id="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const sala = new URLSearchParams(location.search).get("sala") || "recepção";
  const botao = $("botao"), status = $("status");
  const repouso = () => { botao.title = `Emergência — ${sala}. Clique duas vezes para acionar.`; };
  repouso();

  const codigo = localStorage.getItem("codigo-acesso-monte-serrat");
  const socket = io({ auth: { codigo } });

  socket.on("connect", () => { status.classList.remove("erro"); status.textContent = sala; });
  socket.on("disconnect", () => { status.classList.add("erro"); status.textContent = "sem conexão"; });
  socket.on("connect_error", () => { status.classList.add("erro"); status.textContent = "entre no painel primeiro"; });

  let armado = false, timer = null;
  botao.onclick = () => {
    if(!armado){
      armado = true;
      botao.classList.add("armado");
      botao.textContent = "Confirmar?";
      botao.title = "Clique de novo para acionar";
      // 12 segundos para confirmar; sem confirmação, volta ao repouso
      timer = setTimeout(() => {
        armado = false;
        botao.classList.remove("armado");
        botao.textContent = "⚠";
        repouso();
      }, 12000);
      return;
    }
    clearTimeout(timer);
    armado = false;
    socket.emit("emergencia", { sala });
    botao.classList.remove("armado");
    botao.classList.add("acionado");
    botao.textContent = "✓";
    botao.title = "Código anunciado na recepção";
    setTimeout(() => {
      botao.classList.remove("acionado");
      botao.textContent = "⚠";
      repouso();
    }, 12000);
  };
})();
</script>
</body>
</html>
