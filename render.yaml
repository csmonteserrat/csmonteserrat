services:
  - type: web
    name: indicadores-saude-bucal
    runtime: static
    plan: free
    buildCommand: echo "Site estático pronto"
    staticPublishPath: .
    autoDeployTrigger: commit
    previews:
      generation: automatic
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
